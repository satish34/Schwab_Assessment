apiVersion: v1
kind: ResourceQuota
metadata:
  name: application-capacity
  namespace: currency-app-a
spec:
  hard:
    pods: "12"
    requests.cpu: "3"
    requests.memory: 12Gi
    limits.cpu: "6"
    limits.memory: 16Gi
    count/deployments.apps: "6"
    count/horizontalpodautoscalers.autoscaling: "6"
    configmaps: "8"
    services: "4"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: evidence-capacity
  namespace: currency-observability
spec:
  hard:
    pods: "1"
    requests.cpu: 250m
    requests.memory: 512Mi
    requests.ephemeral-storage: 256Mi
    limits.cpu: 500m
    limits.memory: 768Mi
    limits.ephemeral-storage: 640Mi
    count/jobs.batch: "1"
    configmaps: "4"
    services: "0"
    secrets: "0"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: application-capacity
  namespace: currency-app-b
spec:
  hard:
    pods: "10"
    requests.cpu: "3"
    requests.memory: 8Gi
    limits.cpu: "6"
    limits.memory: 12Gi
    count/deployments.apps: "3"
    count/horizontalpodautoscalers.autoscaling: "3"
    configmaps: "8"
    services: "4"
