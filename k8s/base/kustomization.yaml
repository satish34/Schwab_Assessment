apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - fault-config.yaml
  - app-a-deployment.yaml
  - app-b-deployment.yaml
  - services.yaml
  - autoscaling.yaml
  - pod-disruption-budgets.yaml
  - network-policies.yaml
configMapGenerator:
  - name: runtime-config
    namespace: risk-system
    literals:
      - RISK_REGION=local
      - RISK_CLUSTER=local
      - SERVICE_VERSION=dev
generatorOptions:
  disableNameSuffixHash: true
