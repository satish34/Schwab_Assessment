apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-b-engine
  namespace: currency-app-b
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-b-engine
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
