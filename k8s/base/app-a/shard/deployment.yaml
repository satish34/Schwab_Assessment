apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a-gateway
  namespace: currency-app-a
  labels:
    app: app-a-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: app-a-gateway
  template:
    metadata:
      labels:
        app: app-a-gateway
    spec:
      serviceAccountName: app-a-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app-a-gateway
          image: app-a-image:GIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVICE_REGION
              valueFrom:
                configMapKeyRef:
                  name: runtime-config
                  key: SERVICE_REGION
            - name: SERVICE_CLUSTER
              valueFrom:
                configMapKeyRef:
                  name: runtime-config
                  key: SERVICE_CLUSTER
            - name: SERVICE_VERSION
              value: GIT_SHA
            - name: APP_B_BASE_URL
              value: http://app-b-engine.currency-app-b.svc.cluster.local:8080
            - name: APP_B_AUTH_MODE
              value: google-id-token
            - name: APP_B_TOKEN_AUDIENCE
              value: https://app-b-engine.schwab-assessment.internal
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: OTEL_TRACING_ENABLED
              value: "true"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: CLOUD_PROFILER_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1280Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            # Direct telemetry and Profiler initialization can extend an
            # Autopilot cold start beyond two minutes. Allow at most three
            # minutes for startup; liveness remains strict once it succeeds.
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
