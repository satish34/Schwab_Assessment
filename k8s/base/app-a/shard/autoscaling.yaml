apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-a-gateway
  namespace: currency-app-a
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-a-gateway
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
