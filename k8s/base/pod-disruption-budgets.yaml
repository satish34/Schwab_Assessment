apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-a-gateway
  namespace: risk-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: app-a-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-b-engine
  namespace: risk-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: app-b-engine
