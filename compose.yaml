name: schwab-assessment

services:
  app-b-engine:
    image: app-b:${SERVICE_VERSION:?SERVICE_VERSION is required}
    build:
      context: ./apps/app-b-dotnet
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      APP_A_IDENTITY_EMAIL: currency-app-a-caller@${PROJECT_ID:-schwab-assessment-gke}.iam.gserviceaccount.com
      APP_B_AUTH_MODE: disabled
      APP_B_TOKEN_AUDIENCE: https://app-b-engine.schwab-assessment.internal
      FAULT_CONFIG_PATH: /etc/app-b-faults/faults.json
      GOOGLE_CLOUD_PROJECT: ${PROJECT_ID:-schwab-assessment-gke}
      SERVICE_CLUSTER: local-compose
      SERVICE_REGION: us-central1
      SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION is required}
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          read -r _ status _ <&3;
          [[ "$$status" == "200" ]]'
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    init: true
    networks:
      - currency-local
    pids_limit: 256
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    user: "10001:10001"
    volumes:
      - type: bind
        source: ${LOCAL_FAULT_DIR:-./.tmp/local-integration/faults}
        target: /etc/app-b-faults
        read_only: true
        bind:
          create_host_path: false

  app-a-gateway:
    image: app-a:${SERVICE_VERSION:?SERVICE_VERSION is required}
    build:
      context: ./apps/app-a-java
    depends_on:
      app-b-engine:
        condition: service_healthy
    environment:
      APP_B_AUTH_MODE: disabled
      APP_B_BASE_URL: http://app-b-engine:8080
      APP_B_TOKEN_AUDIENCE: https://app-b-engine.schwab-assessment.internal
      GOOGLE_CLOUD_PROJECT: ${PROJECT_ID:-schwab-assessment-gke}
      SPRING_PROFILES_ACTIVE: local
      SERVICE_CLUSTER: local-compose
      SERVICE_REGION: us-central1
      SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION is required}
    ports:
      - "127.0.0.1:${LOCAL_APP_A_PORT:?LOCAL_APP_A_PORT is required}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          read -r _ status _ <&3;
          [[ "$$status" == "200" ]]'
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    init: true
    networks:
      - currency-local
    pids_limit: 256
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    user: "10001:10001"

networks:
  currency-local:
    driver: bridge
