apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: currency-observability
resources:
  - gke/job.yaml
configMapGenerator:
  - name: currency-grafana-provisioning
    files:
      - datasources.yaml=provisioning/datasources.yaml
      - dashboards.yaml=provisioning/dashboards.yaml
  - name: currency-grafana-dashboard
    files:
      - currency-dashboard.json=currency-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: currency-grafana-evidence
    app.kubernetes.io/managed-by: evidence-workflow
