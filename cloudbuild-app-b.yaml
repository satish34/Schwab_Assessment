steps:
  - id: validate-inputs
    name: docker.io/library/bash@sha256:ae4668c2560999e65e89532cd2ad1b6688bb23298189f0bd229ef80fa4bd0831
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ '${_GIT_SHA}' =~ ^[0-9a-f]{40}$ ]]
        [[ '${_REPOSITORY}' == 'us-central1-docker.pkg.dev/${PROJECT_ID}/risk' ]]
        printf 'Building immutable App B image for commit %s.\n' '${_GIT_SHA}'

  - id: test-app-b
    name: mcr.microsoft.com/dotnet/sdk@sha256:306301580fcaa5b445180e759db59309979002d1000669cb4cf58a567d0014bc
    dir: apps/app-b-dotnet
    entrypoint: bash
    args:
      - -ceu
      - |
        dotnet restore AppB.sln --nologo
        dotnet format AppB.sln --verify-no-changes --no-restore --verbosity minimal
        dotnet test AppB.sln --configuration Release --no-restore --nologo
    waitFor: [validate-inputs]

  - id: build-app-b
    name: gcr.io/cloud-builders/docker@sha256:617f98016081e2978c0b44184d7b09446027b909f1078b8fdc23efc4c74c5f20
    args:
      - build
      - --pull
      - --platform=linux/amd64
      - --label
      - org.opencontainers.image.revision=${_GIT_SHA}
      - --label
      - org.opencontainers.image.version=${_GIT_SHA}
      - --tag
      - ${_REPOSITORY}/app-b:${_GIT_SHA}
      - apps/app-b-dotnet
    waitFor: [test-app-b]

  - id: export-app-b-for-scan
    name: gcr.io/cloud-builders/docker@sha256:617f98016081e2978c0b44184d7b09446027b909f1078b8fdc23efc4c74c5f20
    args:
      - image
      - save
      - --output=/workspace/app-b-image.tar
      - ${_REPOSITORY}/app-b:${_GIT_SHA}
    waitFor: [build-app-b]

  # Publish is blocked by every HIGH/CRITICAL finding that has a vendor fix.
  - id: scan-app-b
    name: docker.io/aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
    args:
      - image
      - --input=/workspace/app-b-image.tar
      - --scanners=vuln
      - --severity=HIGH,CRITICAL
      - --ignore-unfixed
      - --exit-code=1
      - --no-progress
      - --skip-version-check
      - --timeout=10m
    waitFor: [export-app-b-for-scan]

substitutions:
  _GIT_SHA: UNSET
  _REPOSITORY: UNSET

images:
  - ${_REPOSITORY}/app-b:${_GIT_SHA}

serviceAccount: projects/schwab-assessment-gke/serviceAccounts/risk-cloud-build@schwab-assessment-gke.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  sourceProvenanceHash: [SHA256]

timeout: 1800s

tags:
  - currency-assessment
  - app-b
  - immutable-image
